# Automatic PR review: describe, review and inline suggestions on every push.
# The prompt and job live in the shared reusable workflow:
# https://github.com/Miggets7/claude-plugins/blob/main/.github/workflows/pr-review.yml
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  # One review per PR at a time: a new push cancels the in-progress (stale) run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: Miggets7/claude-plugins/.github/workflows/pr-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
